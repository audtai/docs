name: Publish AUDT Docs
on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: audt-docs-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/production'
    name: Production
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://docs.audt.work
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        id: setup-node
        with:
          node-version: 24.x
          cache: pnpm

      - name: Restore node_modules (cache hit)
        id: node-modules-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json') }}

      - name: Install node_modules (cache miss)
        run: pnpm install --frozen-lockfile
        if: steps.node-modules-cache.outputs.cache-hit != 'true'

      - name: Restore Astro assets from cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            .astro-cache/assets
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-

      - name: Restore licensed AUDT webfonts
        env:
          AUDT_FONT_ARCHIVE_KEY: ${{ secrets.AUDT_FONT_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          test -n "${AUDT_FONT_ARCHIVE_KEY:-}"
          mkdir -p public/audt-fonts
          gpg --batch --quiet --yes --pinentry-mode loopback \
            --passphrase "$AUDT_FONT_ARCHIVE_KEY" \
            --output "$RUNNER_TEMP/audt-fonts.tar.gz" \
            --decrypt .github/assets/audt-fonts.tar.gz.gpg
          tar -xzf "$RUNNER_TEMP/audt-fonts.tar.gz" -C public/audt-fonts

      - name: Build
        run: pnpm run build
        env:
          AUDT_TWK_WEBFONT_LICENSE_CONFIRMED: "1"
          BUILD_TARGET: nimbus
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        continue-on-error: true
        with:
          name: site-html
          path: dist-nimbus

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
